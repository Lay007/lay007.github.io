name: Add contact email

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-contact-email.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update contact email
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          if '"email": "mailto:laymob@gmail.com"' not in text:
              marker = '      "url": "https://lay007.github.io/",\n'
              if marker not in text:
                  raise SystemExit("JSON-LD marker not found")
              text = text.replace(
                  marker,
                  marker + '      "email": "mailto:laymob@gmail.com",\n',
                  1,
              )

          if 'href="mailto:laymob@gmail.com"' not in text:
              marker = '          <div class="contact-links">\n'
              if marker not in text:
                  raise SystemExit("Contact marker not found")
              email_link = (
                  '            <a class="contact-link" href="mailto:laymob@gmail.com">\n'
                  '              <div>\n'
                  '                <strong>Email</strong>\n'
                  '                <small>laymob@gmail.com</small>\n'
                  '              </div>\n'
                  '              <span>↗</span>\n'
                  '            </a>\n\n'
              )
              text = text.replace(marker, marker + email_link, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate
        run: |
          grep -q 'href="mailto:laymob@gmail.com"' index.html
          grep -q '"email": "mailto:laymob@gmail.com"' index.html
          python tools/check_site.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-contact-email.yml
          git add index.html
          git commit -m "docs(site): добавить контактный email"
          git push
