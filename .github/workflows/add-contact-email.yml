name: Add contact email

on:
  push:
    paths:
      - .github/workflows/add-contact-email.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add email to contact section and JSON-LD
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          if '"email": "mailto:laymob@gmail.com"' not in text:
              marker = '      "url": "https://lay007.github.io/",\n'
              assert marker in text, "JSON-LD URL marker not found"
              text = text.replace(
                  marker,
                  marker + '      "email": "mailto:laymob@gmail.com",\n',
                  1,
              )

          if 'href="mailto:laymob@gmail.com"' not in text:
              marker = '          <div class="contact-links">\n'
              assert marker in text, "contact links marker not found"
              email_link = '''            <a class="contact-link" href="mailto:laymob@gmail.com">
              <div>
                <strong>Email</strong>
                <small>laymob@gmail.com</small>
              </div>
              <span>↗</span>
            </a>

'''
              text = text.replace(marker, marker + email_link, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate email insertion
        run: |
          grep -q 'mailto:laymob@gmail.com' index.html
          grep -q '"email": "mailto:laymob@gmail.com"' index.html

      - name: Commit update and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-contact-email.yml
          git add index.html
          git commit -m "docs(site): добавить контактный email"
          git push
