<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1202" viewBox="0 0 480 1202" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Pipeline</title>
  <desc id="desc">Engineering workflow from Signal and RF through MATLAB, C++ DSP, fixed-point design, Verilog and FPGA, verification, and metrics. Measurement metrics feed back into MATLAB, C++ DSP, fixed-point, and FPGA implementation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101d"/>
      <stop offset="0.58" stop-color="#09172a"/>
      <stop offset="1" stop-color="#101b34"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.10" cy="0.05" r="0.70">
      <stop offset="0" stop-color="#1b75d0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#1b75d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.80" r="0.60">
      <stop offset="0" stop-color="#7647c9" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7647c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102640"/>
      <stop offset="1" stop-color="#0b1a2d"/>
    </linearGradient>
    <linearGradient id="metricCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18234c"/>
      <stop offset="1" stop-color="#241b4e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#92b9db" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020812" flood-opacity="0.42"/>
    </filter>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#70d8ff"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c67cff"/>
    </marker>
    <style>
      text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
      .h1{fill:#f5f8ff;font-size:34px;font-weight:800;letter-spacing:-0.8px}
      .subtitle{fill:#b7c8df;font-size:14.5px;font-weight:500}
      .stage{fill:#f4f8ff;font-size:23px;font-weight:800;letter-spacing:-0.3px}
      .sub{fill:#bdcde2;font-size:15px;font-weight:500}
      .num{fill:#f8fbff;font-size:14px;font-weight:800;text-anchor:middle;dominant-baseline:middle}
      .core{fill:#f2f6ff;font-size:17px;font-weight:800}
      .core2{fill:#b8c8dd;font-size:14.5px;font-weight:500}
      .feedbackLabel{fill:#d69cff;font-size:12px;font-weight:700;letter-spacing:1.4px}
    </style>
  </defs>

  <rect width="480" height="1202" rx="20" fill="url(#bg)"/>
  <rect width="480" height="1202" rx="20" fill="url(#glowA)"/>
  <rect width="480" height="1202" rx="20" fill="url(#glowB)"/>
  <rect width="480" height="1202" rx="20" fill="url(#grid)"/>
  <rect x="12" y="12" width="456" height="1178" rx="22" fill="none" stroke="#4c80a8" stroke-opacity="0.62" stroke-width="1.4"/>

  <text x="40" y="70" class="h1">Engineering Pipeline</text>
  <text x="41" y="100" class="subtitle">model → software → fixed-point</text>
  <text x="41" y="121" class="subtitle">→ FPGA → measurement → metrics</text>

  <g fill="none" stroke="#70d8ff" stroke-width="2.6" stroke-linecap="round">
    <path d="M210 259V284" marker-end="url(#arrowC)"/>
    <path d="M210 389V414" marker-end="url(#arrowC)"/>
    <path d="M210 519V544" marker-end="url(#arrowC)"/>
    <path d="M210 649V674" marker-end="url(#arrowC)"/>
    <path d="M210 779V804" marker-end="url(#arrowC)"/>
    <path d="M210 909V934" marker-end="url(#arrowC)"/>
  </g>

  <g fill="none" stroke="#c67cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7">
    <path d="M380 988H432V338"/>
    <path d="M432 338H392" marker-end="url(#arrowP)"/>
    <path d="M432 468H392" marker-end="url(#arrowP)"/>
    <path d="M432 598H392" marker-end="url(#arrowP)"/>
    <path d="M432 728H392" marker-end="url(#arrowP)"/>
  </g>
  <text transform="translate(457 663) rotate(-90)" class="feedbackLabel" text-anchor="middle">FEEDBACK</text>

  <g filter="url(#shadow)">
    <rect x="40" y="160" width="340" height="96" rx="20" fill="url(#card)" stroke="#59cbff" stroke-width="2"/>
    <circle cx="74" cy="160" r="18" fill="#10405f" stroke="#70dcff" stroke-width="2"/>
    <text x="74" y="161" class="num">01</text>
    <text x="68" y="210" class="stage">Signal / RF</text>
    <text x="68" y="236" class="sub">problem definition</text>
    <path transform="translate(298 183)" d="M4 26c10-18 18 18 28 0s18 18 28 0" fill="none" stroke="#b9e9ff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="290" width="340" height="96" rx="20" fill="url(#card)" stroke="#59cbff" stroke-width="2"/>
    <circle cx="74" cy="290" r="18" fill="#10405f" stroke="#70dcff" stroke-width="2"/>
    <text x="74" y="291" class="num">02</text>
    <text x="68" y="340" class="stage">MATLAB</text>
    <text x="68" y="366" class="sub">golden reference</text>
    <g transform="translate(298 313)">
      <rect width="62" height="50" rx="10" fill="#0d1d34" stroke="#71d9ff" stroke-width="2"/>
      <path d="M12 38l12-13 10 6 15-20" fill="none" stroke="#c17aff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10 41h42M10 41v-30" fill="none" stroke="#6abfe8" stroke-width="1.6" opacity="0.9"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="420" width="340" height="96" rx="20" fill="url(#card)" stroke="#59cbff" stroke-width="2"/>
    <circle cx="74" cy="420" r="18" fill="#10405f" stroke="#70dcff" stroke-width="2"/>
    <text x="74" y="421" class="num">03</text>
    <text x="68" y="470" class="stage">C++ DSP</text>
    <text x="68" y="496" class="sub">tests and benchmarks</text>
    <g transform="translate(298 443)">
      <rect width="62" height="50" rx="10" fill="#0d1d34" stroke="#71d9ff" stroke-width="2"/>
      <text x="31" y="33" fill="#e4f6ff" font-size="22" font-weight="800" text-anchor="middle">&lt;/&gt;</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="550" width="340" height="96" rx="20" fill="url(#card)" stroke="#59cbff" stroke-width="2"/>
    <circle cx="74" cy="550" r="18" fill="#10405f" stroke="#70dcff" stroke-width="2"/>
    <text x="74" y="551" class="num">04</text>
    <text x="68" y="600" class="stage">Fixed-point</text>
    <text x="68" y="626" class="sub">word length &amp; scaling</text>
    <g transform="translate(298 573)">
      <rect x="6" width="50" height="50" rx="10" fill="#171630" stroke="#cf78ff" stroke-width="2"/>
      <text x="31" y="34" fill="#df9aff" font-size="25" font-style="italic" font-weight="800" text-anchor="middle">fx</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="680" width="340" height="96" rx="20" fill="url(#card)" stroke="#59cbff" stroke-width="2"/>
    <circle cx="74" cy="680" r="18" fill="#10405f" stroke="#70dcff" stroke-width="2"/>
    <text x="74" y="681" class="num">05</text>
    <text x="68" y="730" class="stage">Verilog / FPGA</text>
    <text x="68" y="756" class="sub">streaming RTL</text>
    <g transform="translate(298 703)">
      <rect x="3" width="56" height="50" rx="10" fill="#0d2238" stroke="#71d9ff" stroke-width="2"/>
      <rect x="20" y="13" width="22" height="22" rx="2" fill="none" stroke="#66bfff" stroke-width="2"/>
      <path d="M31 4v9M31 35v9M11 24h9M42 24h9" stroke="#66bfff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="810" width="340" height="96" rx="20" fill="url(#card)" stroke="#59cbff" stroke-width="2"/>
    <circle cx="74" cy="810" r="18" fill="#10405f" stroke="#70dcff" stroke-width="2"/>
    <text x="74" y="811" class="num">06</text>
    <text x="68" y="860" class="stage">Verification</text>
    <text x="68" y="886" class="sub">model / C++ / RTL / HIL</text>
    <g transform="translate(298 833)">
      <rect width="62" height="50" rx="10" fill="#0c2633" stroke="#74e4d0" stroke-width="2"/>
      <path d="M9 27c8-16 14 16 22 0s14 16 22 0" fill="none" stroke="#8ef0dc" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="940" width="340" height="96" rx="20" fill="url(#metricCard)" stroke="#c17aff" stroke-width="2"/>
    <circle cx="74" cy="940" r="18" fill="#342561" stroke="#d08cff" stroke-width="2"/>
    <text x="74" y="941" class="num">07</text>
    <text x="68" y="990" class="stage">Metrics</text>
    <text x="68" y="1016" class="sub">BER / EVM / SNR / latency</text>
    <g transform="translate(298 963)">
      <rect width="62" height="50" rx="10" fill="#1b1738" stroke="#ce7cff" stroke-width="2"/>
      <path d="M14 40v-15M26 40v-28M38 40v-20M50 40v-32" fill="none" stroke="#dc86ff" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M10 40h44" stroke="#8bcfff" stroke-width="1.6" opacity="0.85"/>
    </g>
  </g>

  <g>
    <rect x="40" y="1070" width="400" height="96" rx="16" fill="#081321" fill-opacity="0.88" stroke="#416785" stroke-opacity="0.78" stroke-width="1.5"/>
    <text x="64" y="1103" class="core">Core idea</text>
    <text x="64" y="1128" class="core2">keep algorithms, software, hardware and</text>
    <text x="64" y="1150" class="core2">measurements aligned by reproducible evidence.</text>
  </g>
</svg>
