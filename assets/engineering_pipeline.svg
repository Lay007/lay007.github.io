<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Pipeline</title>
  <desc id="desc">Engineering workflow from Signal and RF through MATLAB, C++ DSP, fixed-point design, Verilog and FPGA, verification, and metrics. Measurement metrics feed back into MATLAB, C++ DSP, fixed-point, and FPGA implementation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101d"/>
      <stop offset="0.58" stop-color="#09172a"/>
      <stop offset="1" stop-color="#101b34"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.10" cy="0.08" r="0.70">
      <stop offset="0" stop-color="#1b75d0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#1b75d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.87" cy="0.70" r="0.58">
      <stop offset="0" stop-color="#7647c9" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#7647c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102640"/>
      <stop offset="1" stop-color="#0b1a2d"/>
    </linearGradient>
    <linearGradient id="metricCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18234c"/>
      <stop offset="1" stop-color="#241b4e"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#92b9db" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="155%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020812" flood-opacity="0.42"/>
    </filter>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#70d8ff"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c67cff"/>
    </marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif}
      .h1{fill:#f5f8ff;font-size:52px;font-weight:800;letter-spacing:-1.2px}
      .subtitle{fill:#b7c8df;font-size:18px;font-weight:500}
      .stage{fill:#f4f8ff;font-size:27px;font-weight:800;letter-spacing:-0.4px}
      .sub{fill:#bdcde2;font-size:17px;font-weight:500}
      .num{fill:#f8fbff;font-size:18px;font-weight:800;text-anchor:middle;dominant-baseline:middle}
      .core{fill:#f2f6ff;font-size:19px;font-weight:800}
      .core2{fill:#b8c8dd;font-size:17px;font-weight:500}
      .feedbackLabel{fill:#d69cff;font-size:14px;font-weight:700;letter-spacing:1.1px}
    </style>
  </defs>

  <rect width="1600" height="800" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="800" rx="24" fill="url(#glowA)"/>
  <rect width="1600" height="800" rx="24" fill="url(#glowB)"/>
  <rect width="1600" height="800" rx="24" fill="url(#grid)"/>
  <rect x="24" y="24" width="1552" height="752" rx="28" fill="none" stroke="#4c80a8" stroke-opacity="0.62" stroke-width="1.6"/>

  <text x="66" y="82" class="h1">Engineering Pipeline</text>
  <text x="68" y="118" class="subtitle">model → software → fixed-point → FPGA → measurement → metrics</text>

  <g fill="none" stroke="#70d8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M420 285H470" marker-end="url(#arrowC)"/>
    <path d="M800 285H850" marker-end="url(#arrowC)"/>
    <path d="M1180 285H1230" marker-end="url(#arrowC)"/>
    <path d="M1370 360V418H200V575H240" marker-end="url(#arrowC)"/>
    <path d="M590 575H650" marker-end="url(#arrowC)"/>
    <path d="M1000 575H1060" marker-end="url(#arrowC)"/>
  </g>

  <g fill="none" stroke="#c67cff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 8">
    <path d="M1375 610H1470V456H300"/>
    <path d="M610 456V360" marker-end="url(#arrowP)"/>
    <path d="M990 456V360" marker-end="url(#arrowP)"/>
    <path d="M1320 456V360" marker-end="url(#arrowP)"/>
    <path d="M300 456V500" marker-end="url(#arrowP)"/>
  </g>
  <text x="1410" y="445" class="feedbackLabel">FEEDBACK</text>

  <g filter="url(#shadow)">
    <rect x="80" y="210" width="340" height="150" rx="23" fill="url(#card)" stroke="#59cbff" stroke-width="2.2"/>
    <circle cx="122" cy="210" r="25" fill="#10405f" stroke="#70dcff" stroke-width="2.2"/>
    <text x="122" y="210" class="num">01</text>
    <path d="M320 258c14-24 26 24 40 0s26 24 40 0" fill="none" stroke="#b9e9ff" stroke-width="3.2" stroke-linecap="round"/>
    <text x="250" y="296" class="stage" text-anchor="middle">Signal / RF</text>
    <text x="250" y="326" class="sub" text-anchor="middle">problem definition</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="210" width="330" height="150" rx="23" fill="url(#card)" stroke="#59cbff" stroke-width="2.2"/>
    <circle cx="512" cy="210" r="25" fill="#10405f" stroke="#70dcff" stroke-width="2.2"/>
    <text x="512" y="210" class="num">02</text>
    <rect x="700" y="226" width="62" height="50" rx="10" fill="#0d1d34" stroke="#71d9ff" stroke-width="2"/>
    <path d="M712 264l12-13 10 6 15-20" fill="none" stroke="#c17aff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M710 267h42M710 267v-30" fill="none" stroke="#6abfe8" stroke-width="1.6" opacity="0.9"/>
    <text x="635" y="296" class="stage" text-anchor="middle">MATLAB</text>
    <text x="635" y="326" class="sub" text-anchor="middle">golden reference</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="210" width="330" height="150" rx="23" fill="url(#card)" stroke="#59cbff" stroke-width="2.2"/>
    <circle cx="892" cy="210" r="25" fill="#10405f" stroke="#70dcff" stroke-width="2.2"/>
    <text x="892" y="210" class="num">03</text>
    <rect x="1085" y="227" width="60" height="48" rx="10" fill="#0d1d34" stroke="#71d9ff" stroke-width="2"/>
    <text x="1115" y="259" fill="#e4f6ff" font-size="22" font-weight="800" text-anchor="middle">&lt;/&gt;</text>
    <text x="1015" y="296" class="stage" text-anchor="middle">C++ DSP</text>
    <text x="1015" y="326" class="sub" text-anchor="middle">tests and benchmarks</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1230" y="210" width="280" height="150" rx="23" fill="url(#card)" stroke="#59cbff" stroke-width="2.2"/>
    <circle cx="1272" cy="210" r="25" fill="#10405f" stroke="#70dcff" stroke-width="2.2"/>
    <text x="1272" y="210" class="num">04</text>
    <rect x="1434" y="226" width="50" height="50" rx="10" fill="#171630" stroke="#cf78ff" stroke-width="2"/>
    <text x="1459" y="260" fill="#df9aff" font-size="25" font-style="italic" font-weight="800" text-anchor="middle">fx</text>
    <text x="1370" y="296" class="stage" text-anchor="middle">Fixed-point</text>
    <text x="1370" y="326" class="sub" text-anchor="middle">word length &amp; scaling</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="240" y="500" width="350" height="150" rx="23" fill="url(#card)" stroke="#59cbff" stroke-width="2.2"/>
    <circle cx="282" cy="500" r="25" fill="#10405f" stroke="#70dcff" stroke-width="2.2"/>
    <text x="282" y="500" class="num">05</text>
    <rect x="505" y="516" width="56" height="50" rx="10" fill="#0d2238" stroke="#71d9ff" stroke-width="2"/>
    <rect x="522" y="529" width="22" height="22" rx="2" fill="none" stroke="#66bfff" stroke-width="2"/>
    <path d="M533 520v9M533 551v9M513 540h9M544 540h9" stroke="#66bfff" stroke-width="2" stroke-linecap="round"/>
    <text x="415" y="586" class="stage" text-anchor="middle">Verilog / FPGA</text>
    <text x="415" y="616" class="sub" text-anchor="middle">streaming RTL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="500" width="350" height="150" rx="23" fill="url(#card)" stroke="#59cbff" stroke-width="2.2"/>
    <circle cx="692" cy="500" r="25" fill="#10405f" stroke="#70dcff" stroke-width="2.2"/>
    <text x="692" y="500" class="num">06</text>
    <rect x="910" y="516" width="62" height="50" rx="10" fill="#0c2633" stroke="#74e4d0" stroke-width="2"/>
    <path d="M920 543c8-16 14 16 22 0s14 16 22 0" fill="none" stroke="#8ef0dc" stroke-width="3" stroke-linecap="round"/>
    <text x="825" y="586" class="stage" text-anchor="middle">Verification</text>
    <text x="825" y="616" class="sub" text-anchor="middle">model / C++ / RTL / HIL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1060" y="500" width="315" height="150" rx="23" fill="url(#metricCard)" stroke="#c17aff" stroke-width="2.2"/>
    <circle cx="1102" cy="500" r="25" fill="#342561" stroke="#d08cff" stroke-width="2.2"/>
    <text x="1102" y="500" class="num">07</text>
    <rect x="1284" y="516" width="62" height="50" rx="10" fill="#1b1738" stroke="#ce7cff" stroke-width="2"/>
    <path d="M1298 554v-15M1310 554v-28M1322 554v-20M1334 554v-36" fill="none" stroke="#dc86ff" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M1294 554h44" stroke="#8bcfff" stroke-width="1.6" opacity="0.85"/>
    <text x="1218" y="586" class="stage" text-anchor="middle">Metrics</text>
    <text x="1218" y="616" class="sub" text-anchor="middle">BER / EVM / SNR / latency</text>
  </g>

  <g>
    <rect x="340" y="700" width="920" height="54" rx="16" fill="#081321" fill-opacity="0.88" stroke="#416785" stroke-opacity="0.78" stroke-width="1.5"/>
    <circle cx="382" cy="727" r="12" fill="none" stroke="#76b9ff" stroke-width="2"/>
    <circle cx="382" cy="727" r="3.8" fill="#76b9ff"/>
    <path d="M382 709v8M382 737v8M364 727h8M392 727h8" stroke="#76b9ff" stroke-width="2" stroke-linecap="round"/>
    <text x="420" y="733" class="core">Core idea:</text>
    <text x="524" y="733" class="core2">keep algorithms, software, hardware and measurements aligned by reproducible evidence.</text>
  </g>
</svg>
