  <g><rect x="490" y="225" width="340" height="180" rx="22" fill="url(#card)" stroke="#55c8ff" stroke-width="2"/><circle cx="535" cy="225" r="27" fill="#0b3150" stroke="#55c8ff" stroke-width="2"/><text x="535" y="225" class="num">02</text><rect x="735" y="242" width="66" height="54" rx="9" fill="#0d1d35" stroke="#4eaef1" stroke-width="2"/><path d="M748 282l11-15 10 7 14-21" fill="none" stroke="#be7aff" stroke-width="3"/><text x="660" y="325" class="stage" text-anchor="middle">MATLAB</text><text x="660" y="360" class="sub" text-anchor="middle">golden reference</text></g>
  <g><rect x="890" y="225" width="340" height="180" rx="22" fill="url(#card)" stroke="#55c8ff" stroke-width="2"/><circle cx="935" cy="225" r="27" fill="#0b3150" stroke="#55c8ff" stroke-width="2"/><text x="935" y="225" class="num">03</text><rect x="1134" y="242" width="66" height="54" rx="9" fill="#0d1d35" stroke="#4eaef1" stroke-width="2"/><text x="1167" y="277" fill="#d8f3ff" font-size="23" font-weight="800" text-anchor="middle">&lt;/&gt;</text><text x="1060" y="325" class="stage" text-anchor="middle">C++ DSP</text><text x="1060" y="360" class="sub" text-anchor="middle">tests and benchmarks</text></g>
