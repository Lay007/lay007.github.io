  <g><rect x="250" y="485" width="320" height="180" rx="22" fill="url(#card)" stroke="#55c8ff" stroke-width="2"/><circle cx="295" cy="485" r="27" fill="#0b3150" stroke="#55c8ff" stroke-width="2"/><text x="295" y="485" class="num">05</text><rect x="487" y="504" width="56" height="50" rx="9" fill="#0c2236" stroke="#4eaef1" stroke-width="2"/><rect x="503" y="517" width="24" height="24" rx="2" fill="none" stroke="#76dfff" stroke-width="2"/><text x="410" y="585" class="stage" text-anchor="middle">Verilog / FPGA</text><text x="410" y="620" class="sub" text-anchor="middle">streaming RTL</text></g>
  <g><rect x="655" y="485" width="360" height="180" rx="22" fill="url(#card)" stroke="#55c8ff" stroke-width="2"/><circle cx="700" cy="485" r="27" fill="#0b3150" stroke="#55c8ff" stroke-width="2"/><text x="700" y="485" class="num">06</text><rect x="930" y="504" width="58" height="50" rx="9" fill="#0c2236" stroke="#4eaef1" stroke-width="2"/><path d="M938 530c8-18 14 18 22 0s14 18 22 0" fill="none" stroke="#7de8d7" stroke-width="3" stroke-linecap="round"/><text x="835" y="585" class="stage" text-anchor="middle">Verification</text><text x="835" y="620" class="sub" text-anchor="middle">model / C++ / RTL / HIL</text></g>
  <g><rect x="1110" y="485" width="360" height="180" rx="22" fill="url(#metricCard)" stroke="#b16cff" stroke-width="2"/><circle cx="1155" cy="485" r="27" fill="#2a2058" stroke="#bd75ff" stroke-width="2"/><text x="1155" y="485" class="num">07</text><rect x="1370" y="504" width="70" height="50" rx="9" fill="#1a1534" stroke="#b96cff" stroke-width="2"/><path d="M1386 542v-13h8v13M1400 542v-24h8v24M1414 542v-34h8v34" fill="none" stroke="#d576ff" stroke-width="2.5"/><text x="1290" y="585" class="stage" text-anchor="middle">Metrics</text><text x="1290" y="620" class="sub" text-anchor="middle">BER / EVM / SNR / latency</text></g>
