<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Pipeline</title>
  <desc id="desc">Engineering workflow from Signal/RF through MATLAB, C++ DSP, fixed-point, Verilog/FPGA and verification to metrics, with metrics feeding back into MATLAB, C++ DSP, fixed-point and FPGA implementation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b14"/><stop offset="0.55" stop-color="#081524"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b2036"/><stop offset="1" stop-color="#09182a"/></linearGradient>
    <linearGradient id="metricCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121b3c"/><stop offset="1" stop-color="#21184a"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b6cff"/><stop offset="1" stop-color="#df73ff"/></linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#93b7dd" stroke-opacity="0.055" stroke-width="1"/></pattern>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#73dcff"/></marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bd75ff"/></marker>
    <style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.h1{fill:#f5f8ff;font-size:52px;font-weight:800;letter-spacing:-1px}.legend{fill:#9fb8d7;font-size:19px;font-weight:500}.stage{fill:#f4f7fd;font-size:28px;font-weight:800}.sub{fill:#b8c9dd;font-size:18px;font-weight:500}.num{fill:#f8fbff;font-size:18px;font-weight:800;text-anchor:middle;dominant-baseline:middle}.core{fill:#f2f6ff;font-size:20px;font-weight:800}.core2{fill:#a9bed8;font-size:18px;font-weight:500}.small{fill:#8fa8c5;font-size:16px;font-weight:600}</style>
  </defs>
  <rect width="1600" height="800" rx="22" fill="url(#bg)"/><rect width="1600" height="800" rx="22" fill="url(#grid)"/><rect x="16" y="16" width="1568" height="768" rx="26" fill="none" stroke="#43617e" stroke-opacity="0.42" stroke-width="1.5"/>
  <text x="64" y="88" class="h1">Engineering Pipeline</text>
  <g transform="translate(66 130)"><g><path d="M0 4l12-6 12 6-12 6zM0 12l12 6 12-6M0 20l12 6 12-6" fill="none" stroke="#8cb2df" stroke-width="2"/><text x="40" y="18" class="legend">Model</text></g><g transform="translate(170)"><path d="M5 6l-7 7 7 7M23 6l7 7-7 7M17 2l-8 22" fill="none" stroke="#8cb2df" stroke-width="2" stroke-linecap="round"/><text x="48" y="18" class="legend">Software</text></g><g transform="translate(380)"><rect width="30" height="30" y="-1" rx="7" fill="none" stroke="#8cb2df" stroke-width="2"/><text x="15" y="20" text-anchor="middle" fill="#8cb2df" font-size="18" font-weight="700">fx</text><text x="48" y="18" class="legend">Fixed-point</text></g><g transform="translate(610)"><rect x="3" y="2" width="26" height="26" rx="3" fill="none" stroke="#53b9ff" stroke-width="2"/><path d="M0 8h6M0 14h6M0 20h6M26 8h8M26 14h8M26 20h8M9-2v7M16-2v7M23-2v7M9 25v7M16 25v7M23 25v7" stroke="#53b9ff" stroke-width="2"/><text x="48" y="18" class="legend">FPGA</text></g><g transform="translate(790)"><path d="M0 18c12-22 18 20 30-3s18 20 30-8" fill="none" stroke="#8cb2df" stroke-width="2"/><text x="78" y="18" class="legend">Measurement</text></g><g transform="translate(1090)"><path d="M0 27V15h7v12M12 27V7h7v20M24 27V0h7v27" fill="none" stroke="#8cb2df" stroke-width="2"/><text x="48" y="18" class="legend">Metrics</text></g></g>
