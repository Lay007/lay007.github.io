  <rect x="285" y="748" width="1030" height="38" rx="13" fill="#08111e" fill-opacity="0.92" stroke="#405a74" stroke-opacity="0.75"/><text x="320" y="773" class="core">Core idea:</text><text x="424" y="773" class="core2">keep algorithms, software, hardware and measurements aligned by reproducible evidence.</text>
